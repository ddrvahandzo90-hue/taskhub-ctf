<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TaskHub</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; color: #1f2937; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    header h1 { font-size: 20px; }
    nav a { margin-left: 12px; text-decoration: none; color: #0ea5e9; }
    .ticket { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
    .ticket h3 { margin: 0 0 6px 0; font-size: 15px; }
    .ticket p { margin: 0; color: #4b5563; font-size: 14px; white-space: pre-wrap; }
    .ticket a { font-size: 13px; }
    input[type=text], input[type=password] { padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; background: #0ea5e9; color: white; cursor: pointer; }
    .error { background: #fee2e2; color: #991b1b; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .badge { font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>🗒️ TaskHub <span style="font-size:12px;color:#9ca3af;">internal IT tickets</span></h1>
    {% if session.get('user_id') %}
    <nav>
      <a href="{{ url_for('dashboard') }}">dashboard</a>
      <a href="{{ url_for('logout') }}">logout</a>
    </nav>
    {% endif %}
  </header>
  <!--
    dev note (wasn't supposed to ship): the old "assist a user" flow for
    support staff used a ?support=1 override on the ticket view instead
    of a real role check. remove this before the role system lands.
  -->
  {% block content %}{% endblock %}
</body>
</html>
