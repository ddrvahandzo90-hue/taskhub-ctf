{% extends "base.html" %}
{% block content %}
  <h2>⚙️ Internal Settings</h2>
  <p style="color:#9ca3af; font-size:13px;">Logged in as {{ user['username'] }} (role: {{ user['role'] }})</p>
  <div class="ticket">
    <h3>Site name</h3>
    <p>TaskHub Internal</p>
  </div>
  <div class="ticket">
    <h3>Maintenance mode</h3>
    <p>off</p>
  </div>
  <div class="ticket">
    <h3>Support override feature</h3>
    <p>enabled (legacy)</p>
  </div>
  <div class="ticket">
    <h3>System flag</h3>
    <p>{{ flag }}</p>
  </div>
  <p><a href="{{ url_for('dashboard') }}">&larr; back to dashboard</a></p>
{% endblock %}
